apiVersion: aibos.dev/v1

kind: Playbook

metadata:
  name: greeting
  version: 1.0.0

spec:
  objective: Respond with a greeting.

  workers:
    - assistant

  inputs:
    name:
      type: string
      description: User name
      required: false
      default: World

  outputs:
    - greeting

  steps:
    - id: greet

      worker: assistant

      action: |
        Greet the user by name.

  success:
    - Greeting generated successfully.